# Baysöz Labs <baysozlabs@proton.me>
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  zero-defect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install uv and toolchain
        run: |
          python -m pip install --upgrade pip uv
          uv venv
          uv pip install -e .
          uv pip install pytest ruff semgrep
      - name: Tests
        run: uv run pytest -q
      - name: Lint and static security
        run: |
          uv run ruff check --select E,F,W,S,B .
          uv run semgrep --config p/default --error .
      - name: Attributed CLI smoke test
        run: uv run baysoz-admissioncel --version
